services:
  babak:
    build: .
    container_name: babak
    volumes:
      # Config
      - ./config.yml:/workspace/config.yml:ro

      # SSH keys for remote access
      - ./ssh:/root/.ssh:ro

      # GPG keys for encrypted backups
      # gpg --export --armor <KEY_ID> > gpg-pubkey.asc
      # gpg --export-secret-keys --armor <KEY_ID> > gpg-secret.asc
      - ./gpg-pubkey.asc:/run/secrets/gpg-pubkey.asc:ro
      - ./gpg-secret.asc:/run/secrets/gpg-secret.asc:ro

      # Backup storage
      - ./backups:/backups

      # Temp directory
      - /tmp/babak:/tmp/babak
    environment:
      - CONFIG_FILE=/workspace/config.yml
      - DEBUG=${DEBUG:-false}
      - PASSPHRASE=""
    restart: unless-stopped

  rclone-sync:
    build:
      context: ./rclone
      dockerfile: Dockerfile
    container_name: babak-rclone-sync
    volumes:
      - ./backups:/workspace/backups:ro
      - ./rclone:/workspace/rclone
      - ./config.yml:/workspace/config.yml:ro
    environment:
      - CONFIG_FILE=/workspace/config.yml
      - BACKUPS_DIR=/workspace/backups
      - RCLONE_CONFIG=/workspace/rclone/rclone.conf
