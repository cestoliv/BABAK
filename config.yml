# System configuration (optional)
system:
  backup_dir: ./backups # Where to store backups
  temp_dir: /tmp/babak # Temporary directory for operations
  gpg_key: "xxxxx" # GPG key ID for encryption (optional)

  # Retention policy (optional) - "Lazy Man's Backup Strategy"
  # retention:
  #   full_backup_lifetime: "6M"    # Keep full backups for 6 months (default)
  #   incremental_lifetime: "1M"    # Keep incremental backups for 1 month (default)
  #   keep_full_chains: 1           # Number of full backup chains to preserve (default)

  # Notifications (optional)
  # ntfy:
  #   url: https://ntfy.sh
  #   topic: babak-backups
  #   username: optional_username  # Optional
  #   password: optional_password  # Optional

  # Duplicity options (optional)
  # duplicity:
  #   allow_source_mismatch: true  # Allow hostname changes between runs (default: true, useful for Docker)
  #   full_if_older_than: "1M"     # Create a new full backup if the last one is older than this (default: 1M)

  # Cloud sync with rclone (optional)
  # rclone:
  #   enabled: true
  #   remote: "s3:my-bucket/babak-backups"  # Remote from rclone.conf
  #   sync_command: "sync"  # "sync" (mirror), "copy" (one-way), or "move"
  #   flags:
  #     - "--progress"
  #     - "--transfers=4"
  #     - "--verbose"
  #   exclude:
  #     - "*.tmp"
  #     - ".DS_Store"
  #   dry_run: false  # Set to true to test without uploading

