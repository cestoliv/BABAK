stages:
  - check
  - build

check:
  image: oven/bun:latest
  stage: check
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - bun install --frozen-lockfile
    - bunx biome check .
    - bunx tsc --noEmit
    - bun test --coverage

.docker-build:
  image: docker:latest
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH
  retry: 2
  before_script:
    - docker info
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        tag=""
        echo "Running on default branch '$CI_DEFAULT_BRANCH': tag = 'latest'"
      else
        tag=":$CI_COMMIT_REF_SLUG"
        echo "Running on branch '$CI_COMMIT_BRANCH': tag = $tag"
      fi
    - |
      if [[ -n "${dir}" ]]; then
        echo "Changing directory to '${dir}'"
        cd "$dir"
      fi
    - |
      if [[ -n "${image_name}" ]]; then
        IMAGE_NAME=""$CI_REGISTRY/$CI_PROJECT_PATH/${image_name}${tag}""
      else
        IMAGE_NAME="$CI_REGISTRY/$CI_PROJECT_PATH${tag}"
      fi
    - docker build --pull -t "$IMAGE_NAME" .
    - docker push "$IMAGE_NAME"

build-babak:
  extends: .docker-build

build-rclone-sync:
  extends: .docker-build
  variables:
    image_name: rclone-sync
    dir: ./rclone
